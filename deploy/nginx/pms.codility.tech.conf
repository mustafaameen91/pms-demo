# /etc/nginx/sites-available/pms.codility.tech
# Only answers for pms.codility.tech, so your other sites are not affected.
# After enabling it, run:  sudo certbot --nginx -d pms.codility.tech
# certbot adds the HTTPS (443) block and the http → https redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name pms.codility.tech;

    # Project files up to 25 MB plus the form around them (matches next.config.ts).
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Pages stream as they render; buffering would hold them back.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Built JS/CSS have hashed names and never change.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
